# Reasoned suppressions for BLOCK-tier findings. A local `aramid override` is
# deliberately refused at this tier: a BLOCK must be adjudicated in a file that
# is committed, diffed and reviewed, not waved through on one machine.
#
# Everything below is ruff S608 ("possible SQL injection through string-based
# query construction") in the two SQLite stores. Each was read before being
# listed here, and they share one root cause: **SQLite cannot bind an
# identifier.** `?` binds values only, so a table or column name can only ever
# reach a statement by interpolation. The question is therefore never "is this
# an f-string" but "where does the name come from", and in every case below it
# comes from a module-level constant, a literal at the call site, or a dict
# lookup that raises before the statement is built.
#
# These are entries, not a rule-wide exemption: S608 stays armed in these files,
# so a NEW interpolation -- one where the name could come from a caller -- still
# blocks. That is the whole point of listing 19 ids instead of ignoring a rule.
#
# Adjudicated 2026-08-10, surfaced when a connection-lifetime fix touched both
# files. They pre-date that change; the gate scans changed files, so they had
# simply never been in front of anyone.
#
# 2026-08-12, v0.3.0: two ids re-affirmed after their fingerprints moved --
# `a376b978` replaced `17a9d795`, `0bec96f6` replaced `93fce77a`. Same findings,
# same code, same reasoning; nothing was newly adjudicated.
#
# 2026-08-13: THE MECHANISM RECORDED HERE ON THE DAY WAS WRONG, and the wrong
# version is the dangerous one to leave standing, because it says the ids rot on
# their own. They do not. An id is not bound to the finding's position: the
# fingerprint hashes the line's CONTENT together with the tool, rule, path and
# occurrence index, and no line number goes into it. Measured on a scratch repo
# against the aramid this repo is pinned to, two arms:
#
#   A  comment inserted above the flagged line, STAGED    line 9 -> 10, id SAME
#   B  the same insertion left UNSTAGED                   line 10 -> 11, id MOVED
#
# The line NUMBER comes from the scanner, which reads the working tree. The line
# CONTENT is read from whichever blob the gate chose -- the index, at pre-commit.
# The two agree until those snapshots diverge, and then the fingerprint hashes a
# DIFFERENT line of code than the one that was flagged. So a cosmetic edit is
# harmless once staged, and an edit still unstaged when the gate runs re-keys
# every finding below it. Which snapshot pair diverged during the v0.3.0 commit
# was not reconstructed; only that the ids listed below are the clean-tree ones.
#
# Verified 2026-08-13 with `git status` empty: a whole-repo
# `aramid check --gate pre-commit --all` reports exactly these 19 ids, every one
# `info`, `new_ids: []`. No entry here is dead and none needs re-adjudicating.
#
# STILL LIVE on the pinned version. aramid fixed it in `85644a1` by carrying the
# scanner's own line content through instead of re-reading it from a ref; that
# is post-0.3.0 and arrives at the next release. Until then, stage before you
# let the gate run. aramid also measured the direction that matters more than
# ours: under a skew, a suppression adjudicated for one statement can downgrade
# a DIFFERENT one -- theirs covered a never-reviewed DELETE with a reviewed
# SELECT's entry.
#
# The same v0.3.0 gate also surfaced the SEMGREP view of these identical
# statements (rule `owasp-top-ten.a03-injection.python-sqli-string-concat`),
# which is handled at the source with bare `# nosemgrep` markers instead of
# entries here. Not a style preference: semgrep namespaces its rule ids by
# config path, so the id it actually emits embeds the absolute location of the
# vendored ruleset -- including a username -- and is therefore unusable both in
# a committed file and in shipped source.

