[project]
name = "graphite"
version = "0.1.0"
description = "Local-first, zero-LLM knowledge graph extraction for codebases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
    "python-louvain>=0.16",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
local-llm = []
# Both mcp lines are supported and measured. `_register_tool_handlers` speaks
# 1.x (the `@server.list_tools()` decorators) and 2.x (`add_request_handler`),
# serving identical tool definitions and dispatch, so the wire contract does
# not depend on which is installed.
#
# The floor stays at 1.0 deliberately: semgrep pins `mcp==1.23.3` and
# `.mcp.json` launches bare `python`, so a `>=2` floor would force a choice
# between graphite's own MCP server and semgrep on the same interpreter.
# The ceiling is 3 because 3.x is unexamined, not because 2.x is broken.
mcp = ["mcp>=1.0,<3"]
# `pytest-timeout` is a DIAGNOSTIC, not a gate: nothing passes `--timeout` by
# default, so it is inert until the portability job asks for it. It is declared
# here because that job installs `[dev]`, and a `--timeout` flag without the
# plugin is an unknown-argument error -- which would turn a hang into a
# different silent failure rather than naming it. See #45.
dev = ["pytest>=8.0", "ruff>=0.5", "pytest-timeout>=2.3"]

[project.scripts]
graphite = "graphite.cli:main"
graphite-mcp = "graphite.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphite"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
# Pin the rule set explicitly: ruff 0.16 expanded its default `select`,
# so relying on defaults makes lint results drift with the installed version.
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
# `assert` IS the point of a test, but aramid's gate forces `--extend-select S`
# (flake8-bandit), so S101 fires once per assert -- 4599 hits across tests/.
# That volume buries real findings long before `aramid arm`, which is the
# failure mode the gate exists to prevent. Suppressed at the source rather
# than in aramid's config: aramid.toml has NO rule-suppression mechanism, so
# the consumer repo's own ruff config is the only real place for this.
# Scoped to S101 alone -- deliberately not a blanket flake8-bandit exemption,
# since the other S-rules can still catch genuine problems in test helpers.
"tests/**" = ["S101"]
[tool.hatch.build.targets.wheel.force-include]
"src/graphite/ts_resolver.mjs" = "graphite/ts_resolver.mjs"

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests importing a top-level package
# (`benchmarks/`, used by tests/test_routing_benchmark.py) resolve however
# pytest is launched. `python -m pytest` prepends the CWD implicitly; the
# `pytest` console script does not. Without this the suite passed one way and
# died in collection the other -- which is how it reached aramid's pre-push
# gate as a blocking "pytest exited 2" while a local run read green.
pythonpath = ["."]
