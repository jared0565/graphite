[project]
name = "graphite"
# Read from `src/graphite/__init__.py`, not written here -- see the note beside
# `__version__`. A static version here would be the one nobody reads: consumers
# import the source tree, and `importlib.metadata` reports the install-time
# string regardless of what this file says.
dynamic = ["version"]
description = "Local-first, zero-LLM knowledge graph extraction for codebases."
readme = "README.md"
# PEP 639: an SPDX expression plus the file, deliberately WITHOUT the old
# `License :: OSI Approved :: MIT License` classifier, which the PEP deprecates.
# Hatchling 1.31.0 accepts the classifier alongside this field -- measured, the
# build exits 0 -- so omitting it avoids two declarations of one fact drifting
# apart, and avoids a combination setuptools >= 77 rejects. It is not a live
# build break here.
#
# Both lines below are needed: `license` states the terms, `license-files` is
# what actually puts LICENSE inside the wheel and sdist. Verified in a built
# wheel: `License-Expression: MIT`, `License-File: LICENSE`, and the file at
# `graphite-VERSION.dist-info/licenses/LICENSE`.
#
# Absence was the silent case: with neither, the default is all-rights-reserved
# and the artifact is not redistributable, and nothing anywhere warns you.
license = "MIT"
license-files = ["LICENSE"]
# MEASURED, not inherited. Full suite, 2816 passed / 44 skipped on every cell,
# all at 2e5e0a2 on Windows:
#
#     3.11.15  3.12.13  3.13.13  (uv-managed CPython)
#     3.14.5                     (system CPython)
#
# Pin the DISTRIBUTION when re-measuring, not just `X.Y`. `uv venv --python 3.13`
# silently preferred the Windows Store build here -- an app-execution alias that
# injects PYTHONUSERBASE, redirects AppData and starts slowly -- and produced
# five failures that looked like a 3.13 incompatibility and were not. Use
# `--managed-python` and check `pyvenv.cfg`'s `home =` before believing a cell.
#
# This axis needs no CI: the four cells above cost nothing locally via uv. Only
# the OS axis (Linux #45, macOS #46) genuinely requires a runner.
requires-python = ">=3.11"
# Claimed only where the suite has actually been run, for the reason above.
#
# POSIX added 2026-08-10 under that same rule, not as an aspiration. Measured on
# GitHub hosted runners at c30ab99, py3.12, full suite, zero failures:
#
#     ubuntu-latest   2850 passed / 37 skipped
#     macos-latest    2850 passed / 37 skipped
#
# Both were red until #45, #46 and #47 closed, which is why the claim was absent
# rather than merely unwritten. The OS axis genuinely needs a runner; the
# version axis does not (see `requires-python` above), so what is claimed here
# is: every listed Python on Windows, and 3.12 on each POSIX platform.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
# Deliberately NOT "Typing :: Typed". The source is annotated throughout, but
# that classifier ships a promise to consumers that the type information is
# usable, and nothing in the gate type-checks it -- there is no `py.typed`
# marker and no mypy/pyright run. Add the marker and a checker together, or
# neither.
dependencies = [
    "networkx>=3.3",
    "python-louvain>=0.16",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
local-llm = []
# Both mcp lines are supported and measured. `_register_tool_handlers` speaks
# 1.x (the `@server.list_tools()` decorators) and 2.x (`add_request_handler`),
# serving identical tool definitions and dispatch, so the wire contract does
# not depend on which is installed.
#
# The floor stays at 1.0 deliberately: semgrep pins `mcp==1.23.3` and
# `.mcp.json` launches bare `python`, so a `>=2` floor would force a choice
# between graphite's own MCP server and semgrep on the same interpreter.
# The ceiling is 3 because 3.x is unexamined, not because 2.x is broken.
mcp = ["mcp>=1.0,<3"]
# `pytest-timeout` is a DIAGNOSTIC, not a gate: nothing passes `--timeout` by
# default, so it is inert until the portability job asks for it. It is declared
# here because that job installs `[dev]`, and a `--timeout` flag without the
# plugin is an unknown-argument error -- which would turn a hang into a
# different silent failure rather than naming it. See #45.
dev = ["pytest>=8.0", "ruff>=0.5", "pytest-timeout>=2.3"]

# Without these the package advertises no way back to its own source. A
# distribution page with no repository link is the shape a typosquat has, and it
# is the first thing a reader checks before installing a tool that reads their
# code and spawns subprocesses.
[project.urls]
Homepage = "https://github.com/jared0565/graphite"
Repository = "https://github.com/jared0565/graphite"
Changelog = "https://github.com/jared0565/graphite/blob/main/CHANGELOG.md"
Issues = "https://github.com/jared0565/graphite/issues"

[project.scripts]
graphite = "graphite.cli:main"
graphite-mcp = "graphite.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/graphite/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/graphite"]

# Say what the sdist contains, rather than inheriting "everything not ignored".
# Two things went wrong with the inherited behaviour, both found by inspecting a
# built archive rather than by reading config:
#
#   * `.claude/settings.local.json` shipped. It is invisible to `git status`
#     because it is ignored by the USER'S GLOBAL gitignore -- a machine-local
#     exclusion that does not travel with the repository, so the packaging tool
#     never saw it as ignored. RELEASING.md makes local configuration in an
#     archive a stop condition.
#   * `docs/superpowers/plans/` carries historical plan documents that quote a
#     developer's absolute paths. Those are a record of what was decided and
#     should not be rewritten -- so exclude them from the artifact instead.
#
# An allowlist, not a denylist: a new local-config directory appearing at the
# repo root should be absent from the sdist by default, not shipped until
# someone notices. Tests are included deliberately -- an sdist a consumer
# cannot run the suite from is not much of a source distribution.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/pyproject.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/RELEASING.md",
    "/CONTRIBUTING.md",
    "/ARCHITECTURE.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
# Pin the rule set explicitly: ruff 0.16 expanded its default `select`,
# so relying on defaults makes lint results drift with the installed version.
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
# `assert` IS the point of a test, but aramid's gate forces `--extend-select S`
# (flake8-bandit), so S101 fires once per assert -- 4599 hits across tests/.
# That volume buries real findings long before `aramid arm`, which is the
# failure mode the gate exists to prevent. Suppressed at the source rather
# than in aramid's config: aramid.toml has NO rule-suppression mechanism, so
# the consumer repo's own ruff config is the only real place for this.
# Scoped to S101 alone -- deliberately not a blanket flake8-bandit exemption,
# since the other S-rules can still catch genuine problems in test helpers.
"tests/**" = ["S101"]
[tool.hatch.build.targets.wheel.force-include]
"src/graphite/ts_resolver.mjs" = "graphite/ts_resolver.mjs"

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests importing a top-level package
# (`benchmarks/`, used by tests/test_routing_benchmark.py) resolve however
# pytest is launched. `python -m pytest` prepends the CWD implicitly; the
# `pytest` console script does not. Without this the suite passed one way and
# died in collection the other -- which is how it reached aramid's pre-push
# gate as a blocking "pytest exited 2" while a local run read green.
pythonpath = ["."]
