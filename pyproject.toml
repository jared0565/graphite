[project]
name = "graphite"
version = "0.1.0"
description = "Local-first, zero-LLM knowledge graph extraction for codebases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
    "python-louvain>=0.16",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "rich>=13.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
local-llm = []
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
graphite = "graphite.cli:main"
graphite-mcp = "graphite.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphite"]

[tool.ruff]
line-length = 100
[tool.hatch.build.targets.wheel.force-include]
"src/graphite/ts_resolver.mjs" = "graphite/ts_resolver.mjs"
