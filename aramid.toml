# aramid repo config -- detected stack: python; package manager: none
schema_version = 1
semgrep_block_armed = true
bake_started = "2026-07-28"

# graphite's full suite is well past the stock 300s pre-push budget.
# Both keys are raised together on purpose: `[tests].timeout_s` is capped by the
# gate's wall-clock budget, so raising it alone would be unreachable (see
# aramid's data/defaults.toml -- "Raise BOTH to allow a longer run"). Kept
# timeout_s below pre_push so the two stay coherent and aramid's
# incoherent-config notice does not fire.
#
# Deliberately NOT pointed at a fast subset via `[tests].command`: this repo's
# gate is the last thing standing between a broken graph engine and five
# consumer repos, so the whole suite gates the push even though it costs minutes.
#
# Raised 780 -> 1200 on 2026-08-07 after the gate blocked a push on
# `pytest timeout` (ledger finding dac10e8a, re-detected after resolving clean
# on 08-03). The suite was ~432s when 780 was chosen and is now 551-710s across
# six measured runs that same day -- ~10% headroom, while the gate runs gitleaks
# and semgrep alongside it. A retry would likely have squeaked through, which
# would have proved the trigger dodged rather than the problem fixed.
#
# This is a symptom fix and the trend is the real issue: the suite has grown
# ~65% and a linear budget bump does not scale. The durable answer is to make it
# faster (parallel execution), not to keep raising this. Revisit when the
# measured max passes ~900s rather than raising again by reflex.
[timeouts]
pre_push = 1500

[tests]
timeout_s = 1200

# [mutation].baseline_timeout_s is deliberately NOT set. Measured 2026-08-11.
#
# The stock budget is mutant_timeout_s * 4 = 480s. graphite's suite has never fit
# it: 36 runs burned 14211s (~3.9h) establishing nothing between 08-08 and 08-11,
# reported as "baseline failing" until aramid split timeout from failure.
#
# Raising it does NOT fix mutation here, and makes the failure quieter. At
# baseline_timeout_s = 1800 the baseline succeeded at baseline_s = 685.8s, and
# then:
#
#   generated: 18, tested: 0, truncated: true, state: "ok"
#   "0 confirmed survivor(s) of 0 mutant(s) tested (budget/cap hit)"
#
# 690s per drain, zero mutants tested, and `aramid status` shows neither a
# degraded streak nor a stood-down line -- it looks healthy. At the default it
# instead stands down loudly after 3 attempts and stops spending. A loud stop
# beats a silent no-op, so the default stays until the real fix lands.
#
# The real fix is a narrower [mutation].test_command: the baseline is the whole
# 2900-test suite, so a per-mutant budget can never fit it. That is a scoping
# decision about which suite is allowed to certify a mutant, not a number to
# raise, and it is deliberately left open rather than guessed at here.
