# aramid repo config -- detected stack: python; package manager: none
schema_version = 1
semgrep_block_armed = true
bake_started = "2026-07-28"

# graphite's full suite is well past the stock 300s pre-push budget.
# Both keys are raised together on purpose: `[tests].timeout_s` is capped by the
# gate's wall-clock budget, so raising it alone would be unreachable (see
# aramid's data/defaults.toml -- "Raise BOTH to allow a longer run"). Kept
# timeout_s below pre_push so the two stay coherent and aramid's
# incoherent-config notice does not fire.
#
# Deliberately NOT pointed at a fast subset via `[tests].command`: this repo's
# gate is the last thing standing between a broken graph engine and five
# consumer repos, so the whole suite gates the push even though it costs minutes.
#
# Raised 780 -> 1200 on 2026-08-07 after the gate blocked a push on
# `pytest timeout` (ledger finding dac10e8a, re-detected after resolving clean
# on 08-03). The suite was ~432s when 780 was chosen and is now 551-710s across
# six measured runs that same day -- ~10% headroom, while the gate runs gitleaks
# and semgrep alongside it. A retry would likely have squeaked through, which
# would have proved the trigger dodged rather than the problem fixed.
#
# This is a symptom fix and the trend is the real issue: the suite has grown
# ~65% and a linear budget bump does not scale. The durable answer is to make it
# faster (parallel execution), not to keep raising this. Revisit when the
# measured max passes ~900s rather than raising again by reflex.
[timeouts]
pre_push = 1500

[tests]
timeout_s = 1200
# Points at the dev venv, and this is load-bearing as of v0.3.0.
#
# Consumers now install graphite as a WHEEL rather than importing this tree
# through a shared editable install. The machine interpreter therefore resolves
# `import graphite` to site-packages -- so a gate run with the machine `pytest`
# would exercise the RELEASED artifact and report green on changes it never
# loaded. This venv holds the editable install, so it is what tests the tree.
#
# THE VENV MUST LIVE OUTSIDE THE CLONE, and that is not tidiness. A venv inside
# the repository fails
# `test_mcp_deep_probe_real_server_supports_trusted_source_inside_selected_repo`:
# the probe treats the in-repo environment as an import shadow of the repo it
# was asked to trust. That test's own docstring says so -- "the same commit
# passes from a venv outside the clone and fails from one inside it" -- and it
# cost a blocked push here to rediscover. Measured both ways: inside, 5/5 fail;
# outside, passes.
#
# Relative, not absolute: an absolute path would bake a developer path (and a
# username) into a committed file, which is the defect 0.3.0 fixed in
# `bootstrap.py`. Resolved against the repo root, which is the gate's cwd.
#
# Argv form, not a string: aramid splits a string command POSIX-style, which
# eats backslashes on Windows. Forward slashes work in either form.
#
# Recreate with:
#   python -m venv ../.venvs/graphite-dev
#   ../.venvs/graphite-dev/Scripts/python.exe -m pip install -e ".[dev,mcp]"
#
# Still the whole suite, deliberately -- see the note above `[timeouts]`.
#
# KNOWN ARTIFACT OF THIS LINE, 2026-08-13 -> 2026-08-31: RESOLVED. `aramid
# status` twice reported the tests slot as a skip streak, and both shapes were
# FALSE ALARMS -- the suite provably ran on every counted run:
#
#   pytest: skipped last N pre-push run(s)    (0.3.0: the detector expected
#     the label it had seen before this key renamed the slot; fixed by
#     round 82's recorded `expected` set, which ages the old label out)
#   tests: skipped last 210 pre-push run(s)   (0.3.1-0.7.1: the registry KEY
#     `tests` rode into `expected` beside the label `python.exe` through
#     aramid's shared key->label expansion, so the detector asked for a name
#     no run ever records and counted every pre-push run in the ledger's
#     history; found here 2026-08-30, channel rounds 155-157)
#
# Fixed in aramid 0.7.2. Measured here 2026-08-31: the first pre-push run
# under 0.7.2 (ledger seq 4834) recorded
#
#   expected = ['gitleaks', 'mypy', 'python.exe', 'semgrep']   -- no 'tests'
#
# and the per-tool skip streaks section is gone from `status`. If a streak
# line for this slot ever reappears, read the newest `run_started.expected`
# from the ledger before believing it: a registry key in that list means the
# detector is asking for a name no run records, not that the suite stopped.
#
# And do NOT "fix" a streak line by reverting this command -- that would
# trade a cosmetic false alarm for a gate that tests the released wheel
# instead of the tree, which is the one failure mode this key exists to
# prevent.
command = ["../.venvs/graphite-dev/Scripts/python.exe", "-m", "pytest"]

# [mutation].baseline_timeout_s is deliberately NOT set. Measured 2026-08-11,
# re-measured 2026-08-12.
#
# The stock budget is mutant_timeout_s * 4 = 480s. graphite's suite has never fit
# it: 36 runs burned 14211s (~3.9h) establishing nothing between 08-08 and 08-11,
# reported as "baseline failing" until aramid split timeout from failure.
#
# Raising it does NOT fix mutation here, and makes the failure quieter. At
# baseline_timeout_s = 1800 the baseline succeeded at baseline_s = 685.8s, and
# then:
#
#   generated: 18, tested: 0, truncated: true, state: "ok"
#   "0 confirmed survivor(s) of 0 mutant(s) tested (budget/cap hit)"
#
# 690s per drain, zero mutants tested, and `aramid status` shows neither a
# degraded streak nor a stood-down line -- it looks healthy. At the default it
# instead stands down loudly after 3 attempts and stops spending. A loud stop
# beats a silent no-op, so the default stays until the real fix lands.
#
# 2026-08-12: aramid (round 68) made the real constraint legible, and it is NOT
# baseline_timeout_s. A second run measured baseline_s = 710.3s (first: 685.8s,
# so ~3.5% apart) and reported:
#
#   no mutants tested: 19 generated, 0 certified -- the 600s wall budget covers
#   the whole item and the baseline alone took 710s.
#
# So the binding knob is [mutation].wall_budget_s, which covers the WHOLE item
# and whose clock starts before the baseline. Raising baseline_timeout_s alone
# buys a baseline that succeeds with nothing left behind it -- which is why it
# stays unset here.
#
# Two ways forward, both open decisions rather than defaults to reach for:
#   * wall_budget_s ~= 710 + 19 mutants * mutant_timeout_s. Worst case is close
#     to 50 min per drain, against a 4-hourly schedule -- real coverage at a
#     real duty cycle.
#   * a narrower [mutation].test_command, which is a scoping decision about
#     which suite may certify a mutant, not a number to raise.
#
# Left open deliberately. The point of aramid's fix is that the operator is now
# TOLD which knob applies; guessing one here would waste that.

# Arms the `shadow` runner (aramid 0.4.0, channel round 120): it reports a
# repo-root file that hijacks `python -m <name>`. It SHIPS DISARMED because
# `graphite` is a real distribution name and a repo may legitimately vendor one
# at its root -- BLOCK-by-default would hand those repos an unattended red on
# upgrade. aramid arms it in its own repo, verified clean first, and recommends
# the same for consumers. Armed here 2026-08-26, on the operator's decision.
#
# Verified clean FIRST, then armed, then proven able to FAIL. Full 2x2, measured
# on this tree with `aramid check --gate pre-commit --json`, exit status read
# from a file rather than through a pipe:
#
#                clean root           aramid.py + graphite.py planted at root
#   disarmed     exit 0, no findings  exit 0, 2 x critical, verdict=warn
#   armed        exit 0, no findings  exit 1, 2 x critical, verdict=block
#
# `shadow` appears in `tools_ran` in ALL FOUR cells, so a clean cell is a
# measurement and not a runner that silently never fired. `verdict_before_ratchet`
# was already `block` in the armed cell, so the block is THIS KEY and not a
# ratchet escalation standing in for it.
#
# The plants were the known-positive CONTROL, and there were two of them on
# purpose. `aramid.py` reproduces round 120's own measured shape, proving the
# detector fires at all; `graphite.py` then answers the question that decides
# whether arming is worth anything HERE. Both were reported -- so `graphite` IS
# in the runner's name set, measured rather than inferred from round 120's prose.
# That matters: `graphite.py` at this root is the exact shape behind the
# eight-surface `-P` migration, so this arming defends the hazard this repo
# actually has. Planting only `graphite.py` could not have distinguished "runner
# works, graphite out of scope" from "runner never fired" -- the same shape as
# the two survey markers that named strings production never emits and returned
# a confident clean.
#
# LEDGER NOTE for whoever reads the history: findings 615feb29 (aramid.py) and
# 733bafea (graphite.py) are DELIBERATE TEST PLANTS from that 2x2, detected
# 01:52:38Z and resolved 01:53:51Z, the same minute the files were deleted. They
# are not a past incident in this repo.
#
# SCOPE, kept separate on purpose. `shadow` detects a hazard FILE at the root.
# It says nothing about whether this repo's launch points carry `-P`, which is
# what decides whether such a file would matter. Arming costs nothing today
# because no hazard file exists -- NOT because the launch points are guarded.
# Do not let a green `shadow` stand in for a `-P` sweep; they are orthogonal
# instruments answering different questions.
#
# Unrelated despite the name: `aramid status` prints an "autolearn: shadow (...)"
# line. That is autolearn's shadow MODE and says nothing about this runner.
[shadow]
shadow_block_armed = true
