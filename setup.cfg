# mypy's configuration lives HERE rather than under [tool.mypy] in
# pyproject.toml, deliberately and temporarily.
#
# aramid's typecheck runner (0.6.0 and earlier) arms itself on a [tool.mypy]
# section or a mypy.ini and then hands EVERY changed file to mypy, not only
# Python -- so a push whose changed set holds exactly one non-Python file
# (a regenerated docs/reference/cli.md, a README edit) is refused as
# `mypy:syntax` when mypy tokenizes Markdown or YAML as Python. The defect is
# accepted by aramid (channel round 140) and fixed in 0.6.1. mypy reads this
# file with the same semantics, `python -m mypy` in the CI lint job is
# unchanged, and this comment is the reminder to move the section back to
# pyproject.toml once the pinned aramid filters by extension.
[mypy]
files = src/graphite
python_version = 3.11
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
show_error_codes = True
pretty = False

# No stubs are published for these. Scoped per module rather than set
# globally so a typo in an import elsewhere still fails the gate.
[mypy-networkx]
ignore_missing_imports = True
[mypy-networkx.*]
ignore_missing_imports = True
[mypy-community]
ignore_missing_imports = True
[mypy-community.*]
ignore_missing_imports = True
[mypy-tree_sitter]
ignore_missing_imports = True
[mypy-tree_sitter_javascript]
ignore_missing_imports = True
[mypy-tree_sitter_typescript]
ignore_missing_imports = True
[mypy-tree_sitter_python]
ignore_missing_imports = True
[mypy-tree_sitter_go]
ignore_missing_imports = True
[mypy-tree_sitter_rust]
ignore_missing_imports = True
[mypy-louvain]
ignore_missing_imports = True
[mypy-mcp]
ignore_missing_imports = True
[mypy-mcp.*]
ignore_missing_imports = True
