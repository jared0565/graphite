name: Publish to PyPI

# Builds the approved tag HERE, in CI, and publishes only if the bytes equal
# the digests a maintainer reviewed and pinned below.
#
# Until 1.0.0 this workflow never built: it uploaded artifacts a maintainer
# had built locally and attached to the GitHub Release, because a rebuild on
# a drifted `main` would produce different bytes. Building FROM THE TAG with
# pinned tools removes the drift, and the digest guard turns "reproducible"
# from an assumption into the thing that decides whether the upload happens:
# a build that does not match the approved digests stops before any upload,
# and PyPI is never touched. Because the artifact is now built by this
# workflow from this tag, the PEP 740 attestation it emits is true.
#
# Authentication is PyPI Trusted Publishing (OIDC). There is deliberately no
# API token anywhere in this repository, in any secret, or in any log: the
# credential is a short-lived token minted per run and scoped to this repo +
# this workflow filename. `RELEASING.md` requires scoped credentials and
# forbids tokens in arguments, history, repository files, or logs; this
# satisfies all of it by having no long-lived credential to mishandle.
#
# Trigger is workflow_dispatch ONLY -- never push, never release. Publication
# is a deliberate act by a maintainer, and a tag push must not be able to
# cause one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Must equal APPROVED_VERSION below, or the run fails."
        required: true
        type: string

concurrency:
  group: publish-pypi
  cancel-in-progress: false

env:
  # The approved release, pinned in the reviewed file rather than supplied at
  # dispatch time. Publishing a NEW version therefore requires editing and
  # committing these four lines -- which is the point: a version whose digests
  # nobody approved cannot be published by typing a different number into a
  # form.
  #
  # Two independent sources for the digests, compared before these lines are
  # edited: the `artifact` job's `dist.sha256` on APPROVED_COMMIT (a Linux
  # build with the pins in release-build-constraints.txt) and the maintainer's
  # local build with the same pins. A digest taken from only one of them is a
  # single source agreeing with itself.
  APPROVED_VERSION: "1.0.1"
  APPROVED_COMMIT: "62b188d9b6fabd4c2367028b7d25b49a3cbf0c07"
  WHEEL_SHA256: "9bbaac6a0ed69b4a90d6509edd5961a4081f5b5b31e60bf1ef9f3ed3e70ccfc9"
  SDIST_SHA256: "19dfb80df90bf77fa9378390b31b4188b5a0f24d921553fc6136b72c262a9f3c"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # OIDC identity for Trusted Publishing. This is the credential.
      id-token: write
      # Attach the built artifacts to the GitHub Release for the tag.
      contents: write
    steps:
      - name: Refuse to publish a version this workflow has not approved
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" != "$APPROVED_VERSION" ]; then
            echo "::error::Dispatched version '$REQUESTED' does not match the approved" \
                 "version '$APPROVED_VERSION' pinned in this workflow."
            echo "To publish a different version, edit APPROVED_VERSION, APPROVED_COMMIT" \
                 "and BOTH digests in .github/workflows/publish.yml and commit that change first."
            exit 1
          fi
          echo "Publishing approved version $APPROVED_VERSION."

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ env.APPROVED_VERSION }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert the tag points at the approved commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$APPROVED_COMMIT" ]; then
            echo "::error::tag v$APPROVED_VERSION is at $actual; the approved commit is $APPROVED_COMMIT"
            exit 1
          fi
          echo "tag v$APPROVED_VERSION -> $actual (approved)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build from the tag with pinned tools
        # `--no-isolation` so the hatchling version is the one pinned in
        # release-build-constraints.txt, not whatever `build` would resolve
        # into a fresh isolated environment today.
        run: |
          set -euo pipefail
          python -m pip install -c release-build-constraints.txt build hatchling
          python -m pip list | grep -Ei '^(build|hatchling) '
          python -m build --no-isolation --sdist --wheel --outdir dist
          ls -l dist
          python scripts/verify_artifact.py dist

      - name: Assert dist/ holds exactly the two expected files
        run: |
          set -euo pipefail
          expected_whl="graphite_code-${APPROVED_VERSION}-py3-none-any.whl"
          expected_sdist="graphite_code-${APPROVED_VERSION}.tar.gz"
          actual="$(ls -A dist | sort | tr '\n' ' ')"
          expected="$(printf '%s\n%s\n' "$expected_whl" "$expected_sdist" | sort | tr '\n' ' ')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::dist/ contents differ from the expected set."
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi

      - name: Verify SHA256 against the approved digests
        run: |
          set -euo pipefail
          # Written OUTSIDE dist/ so the checksum file itself can never become a
          # third thing that gets uploaded.
          manifest="${RUNNER_TEMP}/approved.sha256"
          {
            printf '%s  dist/graphite_code-%s-py3-none-any.whl\n' "$WHEEL_SHA256" "$APPROVED_VERSION"
            printf '%s  dist/graphite_code-%s.tar.gz\n'           "$SDIST_SHA256" "$APPROVED_VERSION"
          } > "$manifest"
          cat "$manifest"
          # `-c` exits non-zero on any mismatch and `--strict` on any malformed
          # line; `set -e` propagates it. This is the guard between a wrong
          # artifact and a permanent, unrepeatable upload -- and it is also
          # the proof that the build reproduced the reviewed bytes.
          sha256sum -c --strict "$manifest"
          echo "Both artifacts match the approved digests."

      - name: Attach the artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${APPROVED_VERSION}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --notes "See CHANGELOG.md for $tag."
          fi
          for f in dist/*; do
            name="$(basename "$f")"
            if gh release view "$tag" --json assets -q '.assets[].name' | grep -qx "$name"; then
              echo "::error::asset $name is already attached to $tag; refusing to clobber"
              exit 1
            fi
          done
          gh release upload "$tag" dist/*
          gh release view "$tag" --json assets -q '.assets[] | "\(.name)  \(.digest)"'

      - name: Publish to PyPI with provenance
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # Loud failure if something is already on the index, rather than a
          # silent skip that would read exactly like a successful first upload.
          skip-existing: false
          print-hash: true
          # True because it is true: the files in dist/ were built by THIS
          # workflow from THIS tag, and matched the reviewed digests.
          attestations: true
