name: Publish to PyPI

# Publishes the artifacts ALREADY ATTACHED to a GitHub release. It never builds.
#
# Why not build here: the only bytes allowed to reach the index are the ones that
# were reviewed, hashed, smoke-tested and recorded in `.graphite-releases/`. A
# rebuild in CI would produce different bytes the moment `main` drifts from the tag
# by even a comment -- and that drift is normal between preparing a release and
# publishing it. Publishing a rebuild is unrecoverable, because PyPI refuses to
# re-upload a version. (For v0.3.0 the drift was already real at publication time:
# `# nosemgrep` annotations added to `src/` after the tag.)
#
# Authentication is PyPI Trusted Publishing (OIDC). There is deliberately no API
# token anywhere in this repository, in any secret, or in any log: the credential
# is a short-lived token minted per run and scoped to this repo + this workflow
# filename. `RELEASING.md` requires scoped credentials and forbids tokens in
# arguments, history, repository files, or logs; this satisfies all of it by
# having no long-lived credential to mishandle.
#
# Trigger is workflow_dispatch ONLY -- never push, never release. Publication is a
# deliberate act by a maintainer, and a tag push must not be able to cause one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish. Must equal APPROVED_VERSION below, or the run fails."
        required: true
        type: string

concurrency:
  group: publish-pypi
  cancel-in-progress: false

env:
  # The approved release, pinned in the reviewed file rather than supplied at
  # dispatch time. Publishing a NEW version therefore requires editing and
  # committing these three lines -- which is the point: a version whose digests
  # nobody approved cannot be published by typing a different number into a form.
  #
  # Source of truth: $GRAPHITE_PROJECTS_ROOT/.graphite-releases/0.4.0/EVIDENCE.md, and
  # independently the `digest` field GitHub computed for each release asset. Both
  # were compared before these lines were edited; a digest taken from only one of
  # them is a single source agreeing with itself.
  APPROVED_VERSION: "0.4.0"
  WHEEL_SHA256: "f98a00506392624a4c5e739301fb5f04edbcd7f96496d575329869d33a2b3569"
  SDIST_SHA256: "a303024cda5316f65d1b239c7335de56125145d9e3e24094b121d94ff8c8f1d4"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # OIDC identity for Trusted Publishing. This is the credential.
      id-token: write
      # Read-only: enough to download the release assets, not enough to alter them.
      contents: read
    steps:
      - name: Refuse to publish a version this workflow has not approved
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" != "$APPROVED_VERSION" ]; then
            echo "::error::Dispatched version '$REQUESTED' does not match the approved" \
                 "version '$APPROVED_VERSION' pinned in this workflow."
            echo "To publish a different version, edit APPROVED_VERSION and BOTH digests" \
                 "in .github/workflows/publish.yml and commit that change first."
            exit 1
          fi
          echo "Publishing approved version $APPROVED_VERSION."

      - name: Download the artifacts attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # Exact filenames, not a glob. A glob would silently widen what gets
          # uploaded, and gh-action-pypi-publish uploads everything in packages-dir.
          gh release download "v${APPROVED_VERSION}" --dir dist \
            --pattern "graphite_code-${APPROVED_VERSION}-py3-none-any.whl" \
            --pattern "graphite_code-${APPROVED_VERSION}.tar.gz"
          ls -l dist

      - name: Assert dist/ holds exactly the two approved files
        run: |
          set -euo pipefail
          expected_whl="graphite_code-${APPROVED_VERSION}-py3-none-any.whl"
          expected_sdist="graphite_code-${APPROVED_VERSION}.tar.gz"
          actual="$(ls -A dist | sort | tr '\n' ' ')"
          expected="$(printf '%s\n%s\n' "$expected_whl" "$expected_sdist" | sort | tr '\n' ' ')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::dist/ contents differ from the approved set."
            echo "  expected: $expected"
            echo "  actual:   $actual"
            exit 1
          fi
          echo "dist/ holds exactly: $actual"

      - name: Verify SHA256 against the approved digests
        run: |
          set -euo pipefail
          # Written OUTSIDE dist/ so the checksum file itself can never become a
          # third thing that gets uploaded.
          manifest="${RUNNER_TEMP}/approved.sha256"
          {
            printf '%s  dist/graphite_code-%s-py3-none-any.whl\n' "$WHEEL_SHA256" "$APPROVED_VERSION"
            printf '%s  dist/graphite_code-%s.tar.gz\n'           "$SDIST_SHA256" "$APPROVED_VERSION"
          } > "$manifest"
          cat "$manifest"
          # `-c` exits non-zero on any mismatch and `--strict` on any malformed
          # line; `set -e` propagates it. This is the ONLY guard between a wrong
          # artifact and a permanent, unrepeatable upload -- every other failure
          # mode in this workflow leaves the index untouched.
          sha256sum -c --strict "$manifest"
          echo "Both artifacts match the approved digests."

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # Loud failure if something is already on the index, rather than a
          # silent skip that would read exactly like a successful first upload.
          skip-existing: false
          print-hash: true
          # These artifacts were built on the maintainer's machine under
          # RELEASING.md and attached to the GitHub release -- they were NOT built
          # by this workflow. Emitting a PEP 740 attestation here would assert a
          # build provenance that did not happen. Leave it off until the build
          # itself moves into CI.
          attestations: false
