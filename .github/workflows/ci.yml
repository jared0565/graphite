name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger exists to measure #29's failure rate. Without it, sampling
  # meant pushing empty commits to main, which is why the rate was never
  # measured and every argument about "is it deterministic" stayed an argument.
  workflow_dispatch:

concurrency:
  # push/PR still coalesce -- a superseded commit's run is wasted work.
  # workflow_dispatch must NOT: sampling needs N runs to survive together, and
  # under a shared group each dispatch would cancel the one before it, leaving
  # a sample size of 1 that looks like a completed measurement.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # These majors track the runner's Node runtime, so they need a periodic
      # bump: v4/v5 were built for Node 20, which the runner now force-migrates
      # to Node 24 and will eventually refuse. The bump surfaces as a run
      # annotation long before it becomes a failure -- read them.
      - uses: actions/checkout@v7
      # Held at v6. v6 is Node 24, so it clears the Node 20 deprecation this
      # bump exists for; v7 is simply not yet demonstrated safe here.
      #
      # This pin was originally justified by "v7 breaks the probe_mcp
      # real-server tests". THAT CLAIM IS REFUTED -- the full suite has since
      # passed under v7 (run 30453660307, 2480 passed). The original bisect
      # (v7 failing 2/2, v5/v6 passing) looked conclusive but is consistent
      # with an intermittent fault: the two failures hit DIFFERENT tests, and
      # at a ~30% flake rate that pattern arises by chance.
      #
      # So the real defect is flaky probe_mcp real-server tests, tracked in
      # #29, independent of action versions. v6 is kept only because it is
      # measured-green here and nothing yet justifies moving; it is NOT a
      # workaround for a v7 incompatibility, because no such incompatibility
      # has been shown. Do not infer one from this pin.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: Lint
        run: python -m ruff check .
      # Cold-cache sample of the #29 pair, dispatch only.
      #
      # `--runxfail` is gone with the quarantine (fixed in 7db0d40); these tests
      # now gate in the `Test` step below like everything else. What this keeps
      # is the ORDERING: the fault was cold-cache sensitive, and running 2700
      # tests first warms the filesystem enough to hide it. Running the pair
      # before the suite preserves a genuinely cold sample on demand.
      #
      # `continue-on-error` because this step must never decide a run's
      # conclusion -- the gating verdict belongs to `Test`. A failure here is
      # evidence, and the probe prints its `[graphite-probe]` diagnostic line
      # (returncode, input_complete, outlived_close_s, and the child's own MCP
      # log) to stderr, which pytest surfaces for a failing test.
      - name: Sample deep-probe cold (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python -m pytest tests/test_doctor.py -k real_server -rA -q
      - name: Test
        run: python -m pytest -q

  # Portability MEASUREMENT, not a gate. `pyproject.toml` claims
  # `requires-python = ">=3.11"` and the gating job above proves exactly one
  # cell of that claim: windows-latest on 3.14. Linux, macOS, and 3.11-3.13 are
  # asserted and have never been run, so today "does graphite work off this
  # machine" is an unknown rather than a yes or a no. This job converts it into
  # data.
  #
  # `continue-on-error` at the JOB level, for the same reason the cold-probe
  # step above carries it: the gating verdict belongs to `test`, and a red main
  # is where the next real failure hides. A leg failing here is EVIDENCE.
  #
  # `fail-fast: false` is load-bearing -- the default cancels surviving legs on
  # the first failure, which would report "Linux is broken" while leaving macOS
  # and every other Python unmeasured. That is the sample-size-of-1 trap the
  # `concurrency` group above already had to defuse once.
  #
  # Deliberately NOT run on push: nine extra legs on every commit to main is a
  # standing cost for a question that only needs re-asking when support claims
  # or dependencies change. Dispatch it, or open a PR.
  portability:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.11" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    name: portability (${{ matrix.os }}, py${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      # Lint is deliberately absent: ruff findings are platform-independent, so
      # re-running them nine times measures nothing the gating job has not.
      - name: Test
        run: python -m pytest -q
