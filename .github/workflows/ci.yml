name: CI

on:
  # NO `paths-ignore` HERE, and the reason is not obvious enough to rediscover.
  # A docs-only commit looks free to skip, but `tests/test_documentation.py`
  # reads the repository's real README/CONTRIBUTING/ARCHITECTURE/RELEASING and
  # asserts required phrases, section ordering, credential-example safety, and
  # that every Markdown link target EXISTS ON DISK. A markdown-only change can
  # therefore fail the suite on its own.
  #
  # Worse for a static ignore list: that document set is DISCOVERED at runtime
  # (`discover_routing_evidence_documents` globs the implementation notes), so
  # any path list pinned in this file would drift out of sync with the test that
  # decides what matters -- silently, and in the unsafe direction. Same hazard as
  # a generated string that is also its own matcher.
  push:
    branches: [main]
  pull_request:
  # Manual trigger exists to measure #29's failure rate. Without it, sampling
  # meant pushing empty commits to main, which is why the rate was never
  # measured and every argument about "is it deterministic" stayed an argument.
  #
  # There is no longer a `portability` input: the matrix below is the gating
  # job, on every event. The input existed while extra legs were metered; this
  # repository is public and standard runners bill zero on public repositories
  # (measured from the timing API on runs 31720053986 and 31748503731 -- every
  # OS at total_ms 0, macOS included). Re-measure before restoring any
  # cost-driven restriction; do not restore one from prose.
  workflow_dispatch:
    inputs:
      # Raises COVERAGE_FLOOR for one run. Its purpose is the negative
      # control of the coverage gate: dispatch with a value above the
      # measurement and the `coverage` job must go red. Empty means "use the
      # committed floor", which is what every push and PR run does. A value
      # BELOW the committed floor is refused by the enforcing step.
      coverage_floor:
        description: "COVERAGE_FLOOR for this run only; must be >= the committed floor (negative control: set above the measurement)"
        type: string
        default: ""

concurrency:
  # push/PR still coalesce -- a superseded commit's run is wasted work.
  # workflow_dispatch must NOT: sampling needs N runs to survive together, and
  # under a shared group each dispatch would cancel the one before it, leaving
  # a sample size of 1 that looks like a completed measurement.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  # Platform-independent checks, run once. Ruff findings do not vary by OS or
  # interpreter, so running them twelve times below would measure nothing.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        # The type gate. `[tool.mypy]` in pyproject.toml scopes it to
        # src/graphite; `py.typed` ships because this is clean.
        run: python -m mypy

  # EVERY SUPPORTED CELL GATES. `pyproject.toml` claims `requires-python =
  # ">=3.11"` on Windows, Linux and macOS -- twelve cells -- and until
  # 2026-08-29 exactly one of them (windows-latest, 3.14) could turn a run red.
  # The other nine ran as an advisory `portability` job with
  # `continue-on-error` at the job level, and two (ubuntu/macOS 3.13) never ran
  # at all. A cell that cannot fail a merge is not a supported platform; it is
  # a classifier.
  #
  # History that still matters, kept short because #45 and #46 hold it in
  # full: the ubuntu legs once HUNG and burned their whole timeout (#45 -- a
  # test froze the GLOBAL monotonic clock, fixed in 2029a41), and macOS once
  # showed 102 failures (#46 -- stale by the time it was re-measured, and
  # closed). Those were the reasons the legs were advisory, and both are gone:
  # all nine advisory legs passed on run 33217126451 before this job was made
  # gating.
  #
  # `fail-fast: false` is load-bearing -- the default cancels surviving legs
  # on the first failure, which would report "Linux is broken" while leaving
  # macOS and every other Python unmeasured. That is the sample-size-of-1 trap
  # the `concurrency` group above already had to defuse once.
  #
  # `--timeout` is what makes a hung leg INFORMATIVE. #45's ubuntu legs each
  # ran to `timeout-minutes` and were killed by the runner, emitting no pytest
  # summary whatsoever -- so after three full matrix runs the blocking test
  # still had no name. A per-test cap converts that into a named test plus a
  # traceback on the first run that reproduces it. `--timeout-method=thread`
  # because `signal` raises in the MAIN thread and cannot describe a deadlock
  # in one of `run_bounded_process`'s reader threads -- the subsystem most
  # likely to be responsible; the thread method dumps EVERY thread's stack.
  # 120s, not 60: the deep-probe tests legitimately take ~31s on Windows, and
  # naming a merely-slow test "the hang" would send the investigation
  # somewhere there is no bug.
  #
  # The old objection to a per-test timeout on the gating job -- "a slow
  # machine naming a slow test would turn main red" -- is answered by the
  # measurement above: 120s is roughly 4x the slowest legitimate test, and a
  # leg that trips it has found something. Read the named test, do not raise
  # the number.
  #
  # BEFORE DISPATCHING THIS FOR A *VERSION* QUESTION, RUN IT LOCALLY -- IT IS
  # FREE AND FASTER. `uv` installs any interpreter on demand:
  #
  #     uv python install 3.12
  #     uv venv --python 3.12 --seed --clear <somewhere>   # --seed: uv omits pip
  #     <somewhere>/Scripts/python -m pip install -e ".[dev,mcp]"
  #     <somewhere>/Scripts/python -m pytest -q
  #
  # Safe alongside the machine-wide install because hatchling writes a .pth
  # into site-packages and NOTHING into the source tree. Linux and macOS
  # cannot be reached from a Windows dev box that way; WSL covers Linux
  # (native ext4, via `uv`), and this matrix is the authority for macOS.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    # 30: push runs of the old gating job landed at 6-9 minutes, the
    # advisory legs at ~8, and the three coverage legs below run ~1.5x
    # slower under the tracer, so this is ~2x headroom over the slowest.
    # It caps a HANG; `--timeout` below caps a TEST. Raise it only after
    # re-measuring the distribution, not on instinct.
    timeout-minutes: 30
    steps:
      # These majors track the runner's Node runtime, so they need a periodic
      # bump: v4/v5 were built for Node 20, which the runner now force-migrates
      # to Node 24 and will eventually refuse. The bump surfaces as a run
      # annotation long before it becomes a failure -- read them.
      - uses: actions/checkout@v7
      # Held at v6. v6 is Node 24, so it clears the Node 20 deprecation this
      # bump exists for; v7 is simply not yet demonstrated safe here.
      #
      # This pin was originally justified by "v7 breaks the probe_mcp
      # real-server tests". THAT CLAIM IS REFUTED -- the full suite has since
      # passed under v7 (run 30453660307, 2480 passed). The original bisect
      # (v7 failing 2/2, v5/v6 passing) looked conclusive but is consistent
      # with an intermittent fault: the two failures hit DIFFERENT tests, and
      # at a ~30% flake rate that pattern arises by chance.
      #
      # So the real defect was flaky probe_mcp real-server tests, tracked in
      # #29 (fixed), independent of action versions. v6 is kept only because it
      # is measured-green here and nothing yet justifies moving; it is NOT a
      # workaround for a v7 incompatibility, because no such incompatibility
      # has been shown. Do not infer one from this pin.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      # Cold-cache sample of the #29 pair, dispatch only, on the cell the
      # maintainer develops on.
      #
      # `--runxfail` is gone with the quarantine (fixed in 7db0d40); these tests
      # now gate in the `Test` step below like everything else. What this keeps
      # is the ORDERING: the fault was cold-cache sensitive, and running 3000
      # tests first warms the filesystem enough to hide it. Running the pair
      # before the suite preserves a genuinely cold sample on demand.
      #
      # `continue-on-error` because this step must never decide a run's
      # conclusion -- the gating verdict belongs to `Test`. A failure here is
      # evidence, and the probe prints its `[graphite-probe]` diagnostic line
      # (returncode, input_complete, outlived_close_s, and the child's own MCP
      # log) to stderr, which pytest surfaces for a failing test.
      - name: Sample deep-probe cold (dispatch only)
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest' && matrix.python == '3.14'
        continue-on-error: true
        run: python -m pytest tests/test_doctor.py -k real_server -rA -q
      - name: Test
        if: matrix.python != '3.12'
        run: python -m pytest -q -rs --timeout=120 --timeout-method=thread
      # Coverage is collected on ONE Python per OS -- the tracer costs ~1.5x
      # wall time, and the line-coverage question is not a version question.
      # 3.12 on every OS so the platform-only code (windows_task, systemd,
      # launchd, the POSIX process paths) is all measured and combined below.
      - name: Test with coverage
        if: matrix.python == '3.12'
        env:
          COVERAGE_FILE: .coverage.${{ matrix.os }}
        run: python -m pytest -q -rs --timeout=120 --timeout-method=thread --cov --cov-branch --cov-report=
      - name: Upload coverage data
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: .coverage.${{ matrix.os }}
          # Dotfiles are skipped by default -- an omission here uploads
          # nothing and the combine job would then combine nothing.
          include-hidden-files: true
          if-no-files-found: error

  # THE SAME GATES THE LOCAL GIT HOOKS RUN, against the committed aramid.toml,
  # unmodified, and blocking.
  #
  # windows-latest rather than ubuntu because `[tests].command` in aramid.toml
  # names `../.venvs/graphite-dev/Scripts/python.exe` -- the real venv layout
  # on Windows -- so creating that venv makes the committed configuration
  # true here without patching a line of it. The suite therefore runs a
  # thirteenth time inside this job; that is what makes "the local gate runs
  # in CI" literally true rather than approximately.
  #
  # `--strict` is aramid's CI mode: a DEGRADED tool (one that could not run)
  # fails the job instead of being skipped. The `tools_ran` assertions below
  # are the second half of that: a run in which a scanner silently never
  # fired must not read as clean.
  security:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks and the pre-push scope want history, not a single commit.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Create the dev venv that aramid.toml points at
        shell: bash
        run: |
          set -euo pipefail
          python -m venv ../.venvs/graphite-dev
          ../.venvs/graphite-dev/Scripts/python.exe -m pip install -e ".[dev,mcp]"
      - name: Install aramid and the tools its typecheck slot resolves on PATH
        # aramid 0.6.1 is what this machine runs (channel round 144: the typecheck
        # runner now hands mypy only .py/.pyi); dependabot proposes bumps. mypy is
        # installed for THIS interpreter because aramid's typecheck slot runs it
        # from PATH, not from the dev venv.
        run: python -m pip install "aramid==0.6.1" "mypy>=1.14"
      - name: CI-only keys the repository leaves unset
        shell: bash
        # aramid merges defaults <- ~/.aramid/config.toml <- <root>/aramid.toml.
        # The repo file does not set [llm], so the user layer decides it here:
        # the LLM reviewer has no provider on a runner and must not degrade
        # the gate. Nothing in the repository is patched.
        run: |
          mkdir -p ~/.aramid
          printf '[llm]\nenabled = false\n' > ~/.aramid/config.toml
      - name: aramid doctor --fix (informational)
        shell: bash
        # doctor exits 1 when an OPTIONAL LLM provider is absent, which is
        # every hosted runner. It is run for its report, not its verdict: the
        # two `--strict` gates below fail on any DEGRADED tool, and the
        # tools_ran assertions fail on a scanner that silently never fired.
        # Measured on run 33237751838: every BLOCK-tier tool OK, only
        # claude-cli/codex-cli/openrouter/ollama-cloud MISSING.
        # GitHub runs `shell: bash` as `bash -eo pipefail`, so a non-zero
        # doctor would abort the step before the report is even printed;
        # the status is captured explicitly instead.
        run: |
          status=0
          aramid doctor --fix > doctor.txt 2>&1 || status=$?
          echo "doctor exit status: $status"
          cat doctor.txt
          if grep -qE '^\s+MISSING\s+(gitleaks|semgrep|ruff|pip-audit|tests|interpreter)\b' doctor.txt; then
            echo "::error::a BLOCK-tier tool is missing on the runner"; exit 1
          fi
      - name: Pre-commit gate (gitleaks, ruff security rules, shadow)
        shell: bash
        run: |
          status=0
          aramid check --gate pre-commit --all --strict --json > precommit.json 2> precommit.err || status=$?
          echo "pre-commit gate exit status: $status"
          cat precommit.err
          python - <<'PY'
          import json
          d = json.load(open("precommit.json", encoding="utf-8"))
          ran = set(d.get("tools_ran", []))
          need = {"gitleaks", "ruff", "shadow"}
          assert need <= ran, f"pre-commit gate did not run {sorted(need - ran)}; ran={sorted(ran)}"
          # Verdict from the report, not the exit status (see the pre-push step).
          blocking = [f for f in d.get("findings", []) if f.get("verdict") == "block"]
          print("pre-commit tools_ran:", sorted(ran), "| degraded:", d.get("degraded"),
                "| findings:", len(d.get("findings", [])), "| block-tier:", len(blocking))
          assert not blocking, "block-tier findings:\n" + "\n".join(
              f"  {f.get('tool')}:{f.get('rule')} {f.get('file')}:{f.get('line')} {str(f.get('message'))[:120]}"
              for f in blocking[:25]
          )
          PY
          [ "$status" -eq 0 ]
      - name: Pre-push gate (gitleaks, semgrep, shadow, typecheck, tests)
        shell: bash
        run: |
          status=0
          aramid check --gate pre-push --all --strict --json > prepush.json 2> prepush.err || status=$?
          echo "pre-push gate exit status: $status"
          cat prepush.err
          python - <<'PY'
          import json
          d = json.load(open("prepush.json", encoding="utf-8"))
          ran = set(d.get("tools_ran", []))
          # Every scanner the gate is configured to run, by the label aramid
          # actually emits (measured from this job's own prepush.json artifact,
          # run 33280345301: gitleaks, mypy, python.exe, semgrep, shadow). A
          # scanner missing here is a scanner that silently never fired; the
          # tests slot is labelled by its command, hence the separate check.
          need = {"gitleaks", "semgrep", "shadow", "mypy"}
          assert need <= ran, f"pre-push gate did not run {sorted(need - ran)}; ran={sorted(ran)}"
          tests_slot = {"pytest", "python.exe", "tests"}
          assert ran & tests_slot, f"the tests slot did not run; ran={sorted(ran)}"
          # The verdict is read from the REPORT, never from the exit status
          # alone. Measured 2026-08-30: this step passed (exit 0) on runs
          # 33265993032 and 33280345301 while its own prepush.json carried 786
          # block-tier findings (aramid 0.6.1's typecheck slot over every .py
          # under --all, warn escalated to block by the ratchet); the same
          # report on the maintainer's machine exits 1. Reported to aramid.
          # Until settled, any block-tier finding from a non-mypy scanner, or
          # from mypy inside the project's own type-gate scope (pyproject
          # [tool.mypy] files = src/graphite), fails this step. mypy findings
          # on tests/, scripts/ and benchmarks/ -- which that scope leaves
          # untyped on purpose -- are counted and printed, not hidden.
          typed = ("src/graphite/",)
          blocking = [f for f in d.get("findings", []) if f.get("verdict") == "block"]
          in_scope = [
              f for f in blocking
              if f.get("tool") != "mypy" or str(f.get("file", "")).replace("\\", "/").startswith(typed)
          ]
          print("pre-push tools_ran:", sorted(ran), "| degraded:", d.get("degraded"),
                "| findings:", len(d.get("findings", [])), "| block-tier:", len(blocking),
                "| of which mypy outside the type-gate scope:", len(blocking) - len(in_scope))
          assert not in_scope, "block-tier findings in scope:\n" + "\n".join(
              f"  {f.get('tool')}:{f.get('rule')} {f.get('file')}:{f.get('line')} {str(f.get('message'))[:120]}"
              for f in in_scope[:25]
          )
          PY
          [ "$status" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aramid-gate-reports
          path: |
            precommit.json
            prepush.json

  # ONE number for the whole matrix, with a floor that can only rise.
  #
  # Each OS leg's data file is combined here; the result includes code that
  # only runs on one platform, which is why no single leg's figure is the
  # measurement. COVERAGE_FLOOR is the integer part of the first combined run
  # and is raised when a release measures higher; lowering it needs a
  # CHANGELOG entry saying what was removed and why (CONTRIBUTING.md,
  # "Coverage floor").
  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install coverage
        run: python -m pip install "coverage[toml]>=7.6"
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Combine the three OS runs
        run: |
          set -euo pipefail
          ls -la .coverage.*
          count=$(ls .coverage.* | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "::error::expected 3 coverage data files (one per OS), found $count"
            exit 1
          fi
          python -m coverage combine .coverage.*
          python -m coverage json -o coverage.json
          python -m coverage report --format=markdown > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report | grep '^TOTAL'
      - name: Enforce the floor
        # A dispatch may RAISE the floor for ONE run -- that is the negative
        # control: dispatch with a floor above the measurement and this step
        # must fail. It can never lower it: a requested value below the
        # committed COVERAGE_FLOOR fails this step before coverage is read, so
        # a dispatched run cannot report green against a weaker gate than the
        # one every push and PR run enforces.
        env:
          COVERAGE_FLOOR: "83"
          REQUESTED_FLOOR: ${{ inputs.coverage_floor }}
        run: |
          set -euo pipefail
          floor="$COVERAGE_FLOOR"
          if [ -n "$REQUESTED_FLOOR" ]; then
            if ! [[ "$REQUESTED_FLOOR" =~ ^[0-9]+$ ]] || [ "$REQUESTED_FLOOR" -lt "$COVERAGE_FLOOR" ]; then
              echo "::error::coverage_floor='$REQUESTED_FLOOR' is not an integer >= the committed floor $COVERAGE_FLOOR; a dispatch may only raise the floor"
              exit 1
            fi
            floor="$REQUESTED_FLOOR"
          fi
          echo "floor: $floor (committed: $COVERAGE_FLOOR)"
          python -m coverage report --fail-under="$floor" > floor.txt 2>&1; echo "EXIT=$?" >> floor.txt
          tail -2 floor.txt
          grep -q '^EXIT=0$' floor.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.md

  # CATASTROPHE DETECTOR, not a performance SLA. Builds a 3000-file synthetic
  # repository and records wall time, peak RSS, node/edge counts and graph size
  # as an artifact. It fails only past a 600 s wall (a 3000-file build takes
  # ~30 s here) or past max_graph_bytes -- the regressions that would make a
  # release unusable, not the ones a quiet runner could mistake for noise.
  # docs/benchmarks.md records the runs that back `supported_repo_files`.
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Build a 3000-file synthetic repository
        # -P: neither the checkout nor the script directory is prepended to
        # sys.path, so nothing in repository content can stand in for the
        # installed package the benchmark measures.
        run: python -P benchmarks/build_benchmark.py --files 3000 --out benchmark-metrics.json --wall-budget-s 600
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-metrics
          path: benchmark-metrics.json

  # The ARTIFACT, which nothing else here tests.
  #
  # Every other job installs `-e .` and imports `src/graphite` directly, so the
  # thing a user actually receives is executed by nothing. The only check that
  # ever opened a real distribution was a manual step in RELEASING.md, run once
  # per release -- which makes drift between releases invisible by construction.
  # Two defects were already sitting there when it was first run by hand: the
  # wheel METADATA shipped an absolute developer path (README is the packaging
  # `readme`, so it renders on PyPI), and the release runbook named artifacts the
  # build no longer produces, which would have HALTED the next release on its own
  # mismatch check.
  #
  # ubuntu, and on push rather than dispatch: this bills at 1x, takes a few
  # minutes, and the failure it catches is one nobody sees until release day --
  # exactly the trade the portability matrix makes in the opposite direction.
  #
  # GATING, unlike `portability`. A wheel that ships a credential or drops
  # package data is not evidence to weigh, it is a defect.
  artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the distribution twice with pinned tools and prove determinism
        # The same pins publish.yml uses (release-build-constraints.txt), and
        # `--no-isolation` so they bite. Two builds into two directories must
        # be byte-identical: that is what makes the digests below something a
        # maintainer can approve for the publish job to rebuild against.
        run: |
          set -euo pipefail
          python -m pip install -c release-build-constraints.txt build hatchling
          python -m pip list | grep -Ei '^(build|hatchling) '
          python -m build --no-isolation --sdist --wheel --outdir dist
          python -m build --no-isolation --sdist --wheel --outdir dist-again
          for f in dist/*; do cmp "$f" "dist-again/$(basename "$f")"; done
          echo "both builds byte-identical"
          (cd dist && sha256sum ./* | sed 's#\./##') | tee dist.sha256
      - name: Keep the artifacts and their digests
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: |
            dist/
            dist.sha256
          retention-days: 90
      - name: Inspect what was packaged
        run: python scripts/verify_artifact.py dist
      # Installed into a venv the checkout cannot reach, then exercised from a
      # directory OUTSIDE it. Running from the repo root would let `src/` satisfy
      # the import and the test would pass without the wheel working at all --
      # the whole question is whether the package stands on its own.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/smoke/bin/python" -m pip install dist/*.whl
      - name: Smoke test from outside the checkout
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/smoke"
          PROBE="$RUNNER_TEMP/probe"
          mkdir -p "$PROBE/src"
          cd "$PROBE"
          git init -q
          git config user.email "ci@example.invalid"
          git config user.name "Graphite CI"
          printf 'def greet(name):\n    return f"hi {name}"\n\n\ndef main():\n    return greet("world")\n' > src/app.py
          git add -A
          git commit -qm baseline
          # The import must resolve inside the venv, never back to a checkout.
          "$SMOKE/bin/python" - <<'PY'
          import graphite
          origin = graphite.__file__
          assert "/smoke/" in origin, f"import resolved outside the venv: {origin}"
          print("import origin:", origin)
          PY
          "$SMOKE/bin/graphite" --version
          "$SMOKE/bin/graphite" --llm none build .
          "$SMOKE/bin/graphite" validate --graph-json graph-out/graph.json --json > /dev/null
          # `query` emits JSON by DEFAULT and has no --json flag, unlike
          # `validate` one line up. Passing one fails at the TOP-LEVEL parser,
          # which prints the root usage and makes it look like the wrong command
          # broke. Assert on the payload rather than the exit code: a smoke test
          # that only checks statuses would pass against a query returning
          # nothing at all.
          "$SMOKE/bin/graphite" query "callers greet" > result.json
          "$SMOKE/bin/python" - <<'PY'
          import json
          payload = json.load(open("result.json", encoding="utf-8"))
          assert payload.get("schema_version"), payload
          names = {c["name"] for c in payload.get("callers", [])}
          assert "main" in names, f"expected main to call greet, got {names}"
          print("query resolved a cross-function caller:", names)
          PY
          "$SMOKE/bin/graphite" debt --as-of 2026-01-01 > /dev/null
          echo "installed wheel builds and queries a graph from a clean environment"

      # `init` is the most invasive thing this package does -- it writes git
      # hooks, an MCP server registration, VS Code tasks and agent hooks INTO
      # the user's repository -- and until now it was the one command this
      # smoke test never called.
      #
      # The unit tests cover these surfaces well (including an AST sweep in
      # test_hardening.py requiring `-P` on every in-source launch), but they all
      # run against the SOURCE TREE. They cannot see a template that failed to be
      # packaged. That is not hypothetical: v0.3.0 fixed a path defect present
      # since the first commit which shipped in every prior wheel and which every
      # unit test passed over, because the tests never asked what the ARTIFACT
      # contains.
      - name: Onboard a repo using the installed wheel
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/smoke"
          ONBOARD="$RUNNER_TEMP/onboard"
          mkdir -p "$ONBOARD/src"
          cd "$ONBOARD"
          git init -q
          git config user.email "ci@example.invalid"
          git config user.name "Graphite CI"
          printf 'def greet(name):\n    return f"hi {name}"\n' > src/app.py
          git add -A
          git commit -qm baseline
          "$SMOKE/bin/graphite" init .
          "$SMOKE/bin/python" - <<'PY'
          import json, pathlib, sys

          root = pathlib.Path(".")

          # Every launch site `init` wrote, collected by WALKING WHAT EXISTS
          # rather than by checking a list of expected filenames. Scoping a
          # shadowing sweep by artifact kind is how this project missed surfaces
          # four separate times; the question is only ever "does this chain reach
          # -m", so JSON argv arrays are joined before matching and shell files
          # are read line by line.
          launches = []

          def scan_json(path):
              if not path.is_file():
                  return
              data = json.loads(path.read_text(encoding="utf-8"))
              stack = [data]
              while stack:
                  node = stack.pop()
                  if isinstance(node, dict):
                      argv = node.get("args")
                      cmd = node.get("command")
                      if isinstance(cmd, str) and isinstance(argv, list):
                          launches.append((path, " ".join([cmd, *map(str, argv)])))
                      elif isinstance(cmd, str):
                          launches.append((path, cmd))
                      stack.extend(node.values())
                  elif isinstance(node, list):
                      stack.extend(node)

          for name in (".mcp.json", ".vscode/tasks.json", ".claude/settings.json"):
              scan_json(root / name)

          for hook in sorted((root / ".githooks").glob("*")):
              if hook.is_file():
                  for line in hook.read_text(encoding="utf-8").splitlines():
                      if "-m graphite" in line:
                          launches.append((hook, line.strip()))

          reaching = [(p, c) for p, c in launches if "-m graphite" in c]
          unhardened = [(p, c) for p, c in reaching if "-P" not in c.split()]

          for path, cmd in reaching:
              print(f"  {'OK ' if '-P' in cmd.split() else 'BAD'}  {path}: {cmd[:100]}")

          # A sweep that examined nothing reports zero violations and looks
          # identical to a clean one. This is the control, and it is the reason
          # the number is asserted rather than printed: a rename that moved a
          # surface out of reach would otherwise pass silently.
          print(f"\nlaunch sites reaching `-m graphite`: {len(reaching)}")
          assert len(reaching) >= 8, (
              f"expected init to write at least 8 launch sites, found {len(reaching)}. "
              "Either the sweep stopped seeing a surface, or init stopped writing "
              "one. Both are failures -- find out which before lowering this."
          )
          assert not unhardened, (
              "init wrote graphite launches without `-P`:\n  "
              + "\n  ".join(f"{p}: {c}" for p, c in unhardened)
              + "\n`python -m X` puts the CWD on sys.path[0], so a repo-local "
              "graphite.py wins; a module-shaped shadow RUNS before it errors."
          )

          for required in ("GRAPHITE.md", "AGENTS.md", "CLAUDE.md", ".gitignore"):
              assert (root / required).is_file(), f"init did not write {required}"

          print("init from the installed wheel wrote every surface, all hardened")
          PY
          test -f graph-out/graph.json
          echo "onboarding works from a packaged wheel, not just from the source tree"
