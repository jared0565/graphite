name: CI

on:
  # NO `paths-ignore` HERE, and the reason is not obvious enough to rediscover.
  # A docs-only commit looks free to skip, but `tests/test_documentation.py`
  # reads the repository's real README/CONTRIBUTING/ARCHITECTURE/RELEASING and
  # asserts required phrases, section ordering, credential-example safety, and
  # that every Markdown link target EXISTS ON DISK. A markdown-only change can
  # therefore fail the suite on its own.
  #
  # Worse for a static ignore list: that document set is DISCOVERED at runtime
  # (`discover_routing_evidence_documents` globs the implementation notes), so
  # any path list pinned in this file would drift out of sync with the test that
  # decides what matters -- silently, and in the unsafe direction. Same hazard as
  # a generated string that is also its own matcher.
  push:
    branches: [main]
  pull_request:
  # Manual trigger exists to measure #29's failure rate. Without it, sampling
  # meant pushing empty commits to main, which is why the rate was never
  # measured and every argument about "is it deterministic" stayed an argument.
  workflow_dispatch:
    inputs:
      # Sampling and portability are different questions, and until now every
      # dispatch paid for both: `portability` fired on `workflow_dispatch`
      # unconditionally, so each #29 sample also ran three windows legs at the
      # 2x multiplier -- roughly 48 billed minutes to re-answer a version
      # question the sample was not asking. Sampling is by design repeated N
      # times, so that overcharge multiplied by N, and it is a plausible share
      # of what exhausted the account.
      #
      # Default false: the cheap dispatch stays cheap, and the matrix is opted
      # into when the OS/version axis is actually the question.
      portability:
        description: "Also run the portability matrix (3 extra windows legs, 2x billing)"
        type: boolean
        default: false

concurrency:
  # push/PR still coalesce -- a superseded commit's run is wasted work.
  # workflow_dispatch must NOT: sampling needs N runs to survive together, and
  # under a shared group each dispatch would cancel the one before it, leaving
  # a sample size of 1 that looks like a completed measurement.
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    # 20, not 45. Measured over this workflow's successful history: push runs
    # land at 6-7 minutes and the slowest dispatch observed was 9, so 20 leaves
    # better than 2x headroom over the worst real run. The 45 it replaces was
    # ~6.5x, and on a 2x-billed windows runner that made a HUNG run cost about
    # 90 billed minutes against a normal run's ~13. Hangs are not hypothetical
    # here -- #45 is exactly that failure, and legs burning their full timeout
    # are what took the account's Actions allowance down.
    #
    # This caps a hang; it does not cap a test. Per-test `--timeout` stays off
    # the gating job on purpose (see the portability job's note): a slow machine
    # naming a slow test "the hang" would turn main red, which is where the next
    # real failure hides. Raise this if a legitimate run ever approaches it --
    # but re-measure the distribution first rather than restoring 45 on instinct.
    timeout-minutes: 20
    steps:
      # These majors track the runner's Node runtime, so they need a periodic
      # bump: v4/v5 were built for Node 20, which the runner now force-migrates
      # to Node 24 and will eventually refuse. The bump surfaces as a run
      # annotation long before it becomes a failure -- read them.
      - uses: actions/checkout@v7
      # Held at v6. v6 is Node 24, so it clears the Node 20 deprecation this
      # bump exists for; v7 is simply not yet demonstrated safe here.
      #
      # This pin was originally justified by "v7 breaks the probe_mcp
      # real-server tests". THAT CLAIM IS REFUTED -- the full suite has since
      # passed under v7 (run 30453660307, 2480 passed). The original bisect
      # (v7 failing 2/2, v5/v6 passing) looked conclusive but is consistent
      # with an intermittent fault: the two failures hit DIFFERENT tests, and
      # at a ~30% flake rate that pattern arises by chance.
      #
      # So the real defect is flaky probe_mcp real-server tests, tracked in
      # #29, independent of action versions. v6 is kept only because it is
      # measured-green here and nothing yet justifies moving; it is NOT a
      # workaround for a v7 incompatibility, because no such incompatibility
      # has been shown. Do not infer one from this pin.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: Lint
        run: python -m ruff check .
      # Cold-cache sample of the #29 pair, dispatch only.
      #
      # `--runxfail` is gone with the quarantine (fixed in 7db0d40); these tests
      # now gate in the `Test` step below like everything else. What this keeps
      # is the ORDERING: the fault was cold-cache sensitive, and running 2700
      # tests first warms the filesystem enough to hide it. Running the pair
      # before the suite preserves a genuinely cold sample on demand.
      #
      # `continue-on-error` because this step must never decide a run's
      # conclusion -- the gating verdict belongs to `Test`. A failure here is
      # evidence, and the probe prints its `[graphite-probe]` diagnostic line
      # (returncode, input_complete, outlived_close_s, and the child's own MCP
      # log) to stderr, which pytest surfaces for a failing test.
      - name: Sample deep-probe cold (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python -m pytest tests/test_doctor.py -k real_server -rA -q
      - name: Test
        run: python -m pytest -q

  # Portability MEASUREMENT, not a gate. `pyproject.toml` claims
  # `requires-python = ">=3.11"` and the gating job above proves exactly one
  # cell of that claim: windows-latest on 3.14. Linux, macOS, and 3.11-3.13 are
  # asserted and have never been run, so today "does graphite work off this
  # machine" is an unknown rather than a yes or a no. This job converts it into
  # data.
  #
  # `continue-on-error` at the JOB level, for the same reason the cold-probe
  # step above carries it: the gating verdict belongs to `test`, and a red main
  # is where the next real failure hides. A leg failing here is EVIDENCE.
  #
  # `fail-fast: false` is load-bearing -- the default cancels surviving legs on
  # the first failure, which would report "Linux is broken" while leaving macOS
  # and every other Python unmeasured. That is the sample-size-of-1 trap the
  # `concurrency` group above already had to defuse once.
  #
  # Deliberately NOT run on push: extra legs on every commit to main is a
  # standing cost for a question that only needs re-asking when support claims
  # or dependencies change. Dispatch it, or open a PR.
  #
  # SCOPE IS DELIBERATELY SMALL, and it cost real money to learn why. The first
  # version ran 9 legs including 4x ubuntu and 2x macOS. The ubuntu legs HANG and
  # burn the full timeout doing nothing (#45), and macOS bills at a **10x minute
  # multiplier**. Three runs of that matrix exhausted the account's Actions
  # allowance and took CI down for the whole repository -- gating job included.
  #
  # An instrument nobody can afford to run is not an instrument. Those legs are
  # not deleted, they are BANKED: #45 and #46 hold their findings in full, so
  # re-running them re-learns what is already written down. Restore them while
  # working those issues, not before:
  #
  #     - { os: ubuntu-latest, python: "3.11" }   # ... 3.12, 3.13, 3.14  -> #45
  #     - { os: macos-latest,  python: "3.11" }   # ... and 3.14          -> #46
  #
  # When they ARE restored they will now self-diagnose: the `--timeout` below
  # means a hang names itself instead of dying silently at `timeout-minutes`.
  # Restoring one ubuntu leg is worth more than restoring all four -- #45 hung on
  # every version, so one is a sufficient sample and costs a quarter as much.
  #
  # What remains is the cheap, currently-actionable question: does graphite work
  # on the Python versions it CLAIMS, on the platform it already supports? Three
  # windows legs at the 2x multiplier, ~8 minutes each.
  #
  # BEFORE DISPATCHING THIS FOR A *VERSION* QUESTION, RUN IT LOCALLY -- IT IS FREE.
  # `uv` installs any interpreter on demand, so every windows leg below reproduces
  # on a dev machine in minutes with no billing and no queue:
  #
  #     uv python install 3.12
  #     uv venv --python 3.12 --seed --clear <somewhere>   # --seed: uv omits pip
  #     <somewhere>/Scripts/python -m pip install -e ".[dev,mcp]"
  #     <somewhere>/Scripts/python -m pytest -q
  #
  # Measured: 2772 passed / 44 skipped on local Windows 3.12.13 at 8cd3a92.
  # Safe alongside the machine-wide editable install because hatchling writes a
  # .pth into site-packages and NOTHING into the source tree (setuptools would
  # share `*.egg-info` and clobber it).
  #
  # This job is still the authority for the OS axis -- Linux (#45) and macOS (#46)
  # cannot be reached from a Windows dev box. But routing a *version* question
  # here is what made a 9-leg matrix look necessary, and that matrix exhausted the
  # account's Actions allowance. Local first; dispatch for the OS axis only.
  portability:
    # Opt-in on dispatch (see the `portability` input above), automatic on PR.
    #
    # The event name is tested explicitly rather than leaning on `inputs` being
    # null-and-therefore-falsy outside workflow_dispatch. That shortcut probably
    # works, but "probably" is doing real work in a condition that decides
    # whether three 2x-billed legs run, and CI is currently down so it cannot be
    # demonstrated. Written this way it is true by reading.
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.portability)
    continue-on-error: true
    # 20, not the gating job's 45. The suite takes ~8 minutes here, so a leg
    # still running at 20 has already answered the question -- it is hung. The
    # original 45 was copied from `test` without asking what it was for, and it
    # is what made each hung ubuntu leg cost three quarters of an hour.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.11" }
          - { os: windows-latest, python: "3.12" }
          - { os: windows-latest, python: "3.13" }
          # ONE ubuntu leg, restored 2026-08-09 -- the last thing #45 needs.
          #
          # #45's hang is fixed (`2029a41`: a test froze the GLOBAL monotonic
          # clock, wedging `_terminate_process_tree`'s POSIX grace loop) and the
          # suite now runs 2841 passed / 37 skipped / 0 failed in 3m46s with
          # ZERO `Failed: Timeout >` markers. But that was measured on WSL, and
          # the issue was filed against this runner, so the ticket stays open on
          # an environment gap rather than a known defect. This leg closes it.
          #
          # ONE, not four: #45 hung on every version, so one is a sufficient
          # sample at a quarter of the cost -- and ubuntu bills at 1x, the
          # cheapest runner there is. 3.12 specifically, to match the local
          # measurement exactly: same cell, different environment, so the RUNNER
          # is the only variable left.
          #
          - { os: ubuntu-latest, python: "3.12" }
          # macOS, restored 2026-08-09 to re-measure #46. Its 102 failures were
          # counted on 9ff1242, BEFORE the frozen-clock fix, the Windows-kernel
          # skips, both venv-launcher fixes, the node landmark, the mcp deep-probe
          # stub and #47 -- and 86 of the 102 sat in exactly the probe/subprocess
          # machinery those touched. So the number on file is stale by
          # construction; re-measuring is cheaper than reasoning about it.
          #
          # py3.12 to match the ubuntu leg above, which is green: same cell,
          # different OS, so the PLATFORM is the only variable. #46 already
          # established this is platform-not-version -- identical 102 on both
          # 3.11 and 3.14 -- so one leg is a sufficient sample, as with ubuntu.
          #
          # COST, and it is the reason this was banked: macOS bills at a **10x
          # minute multiplier** on a private repository, and three runs of the
          # original 9-leg matrix exhausted the account's allowance and took CI
          # down entirely. It is free here only while the repo is public and the
          # matrix is dispatch-opt-in. If the repo goes private again, weigh this
          # leg against that multiplier before dispatching -- and note it still
          # fires automatically on `pull_request`.
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    name: portability (${{ matrix.os }}, py${{ matrix.python }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      # Lint is deliberately absent: ruff findings are platform-independent, so
      # re-running them nine times measures nothing the gating job has not.
      #
      # `--timeout` is what makes a hung leg INFORMATIVE. #45's four ubuntu legs
      # each ran to `timeout-minutes` and were killed by the runner, emitting no
      # pytest summary whatsoever -- so after three full matrix runs the blocking
      # test still has no name. A per-test cap converts that into a named test
      # plus a traceback on the first run that reproduces it.
      #
      # `--timeout-method=thread` because `signal` raises in the MAIN thread and
      # cannot describe a deadlock in one of `run_bounded_process`'s reader
      # threads -- the subsystem most likely to be responsible. The thread method
      # dumps EVERY thread's stack before terminating.
      #
      # 120s, not the 60 originally proposed: the deep-probe tests legitimately
      # take ~31s on Windows, and naming a merely-slow test as "the hang" would
      # send the investigation somewhere there is no bug. Measured locally at
      # 4m55s for the whole Linux suite, so 120s per test is ample headroom.
      #
      # Note this is on the NON-GATING job only. The gating `test` job above is
      # deliberately untouched: a timeout there could turn a slow machine into a
      # red main, which is exactly where the next real failure hides.
      - name: Test
        run: python -m pytest -q --timeout=120 --timeout-method=thread
