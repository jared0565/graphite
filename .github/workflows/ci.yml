name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # These majors track the runner's Node runtime, so they need a periodic
      # bump: v4/v5 were built for Node 20, which the runner now force-migrates
      # to Node 24 and will eventually refuse. The bump surfaces as a run
      # annotation long before it becomes a failure -- read them.
      - uses: actions/checkout@v7
      # BISECT: held at v5 deliberately. v7/v7 failed the probe_mcp real-server
      # tests twice while a same-minute control on v4/v5 passed. checkout does
      # not touch the Python environment; setup-python does. If this run is
      # green, setup-python is the culprit and checkout@v7 is safe to keep.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,mcp]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest -q
